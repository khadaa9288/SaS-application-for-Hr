<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | HR SaaS</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary shadow-sm">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="/"
        >
            <i class="bi bi-people-fill me-2"></i>
            HR SaaS
        </a>

    </div>

</nav>


<div class="container">

    <div class="row justify-content-center align-items-center"
         style="min-height: 85vh;">

        <div class="col-md-6 col-lg-5">

            <div class="card border-0 shadow-lg rounded-4">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <div
                            class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center"
                            style="width:70px;height:70px;"
                        >
                            <i class="bi bi-person-lock fs-2"></i>
                        </div>

                        <h2 class="fw-bold mt-3">
                            Welcome Back
                        </h2>

                        <p class="text-muted">
                            Login to your HR SaaS account
                        </p>

                    </div>


                    {% if messages %}

                        {% for message in messages %}

                            <div
                                class="alert alert-{{ message.tags }}"
                                role="alert"
                            >
                                {{ message }}
                            </div>

                        {% endfor %}

                    {% endif %}


                    <form method="POST">

                        {% csrf_token %}


                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Username
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-person"></i>
                                </span>

                                <input
                                    type="text"
                                    name="username"
                                    class="form-control"
                                    placeholder="Enter username"
                                    required
                                >

                            </div>

                        </div>


                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Password
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-lock"></i>
                                </span>

                                <input
                                    type="password"
                                    name="password"
                                    class="form-control"
                                    placeholder="Enter password"
                                    required
                                >

                            </div>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100 py-2 fw-semibold"
                        >

                            <i class="bi bi-box-arrow-in-right me-2"></i>

                            Login

                        </button>

                    </form>


                    <div class="text-center mt-4">

                        <p class="text-muted mb-1">
                            Don't have an account?
                        </p>

                        <a
                            href="{% url 'register' %}"
                            class="text-decoration-none fw-semibold"
                        >
                            Create Employee Account
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<footer class="bg-dark text-white text-center py-3">

    <small>
        © 2026 HR SaaS. All Rights Reserved.
    </small>

</footer>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
